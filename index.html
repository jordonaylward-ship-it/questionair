<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FFFFFF">
<title>A few questions</title>
<style>
:root{
  --paper:#FAFAFA; --card:#FFFFFF; --ink:#262626; --muted:#8E8E8E; --line:#DBDBDB;
  --blue:#0095F6; --soft:#EFEFEF;
  --grad:linear-gradient(90deg,#833AB4 0%,#E1306C 55%,#F77737 100%);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
.shell{display:flex;justify-content:center;padding:0 16px}
.main{width:100%;max-width:620px;padding:18px 0 140px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0 16px}
.logo{font-weight:700;font-size:clamp(16px,4vw,20px);letter-spacing:-0.5px;white-space:nowrap}
.logo span{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.who{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thread{height:3px;border-radius:99px;background:var(--soft);overflow:hidden;margin-bottom:10px}
.thread i{display:block;height:100%;background:var(--grad);border-radius:99px;width:0%;transition:width .35s ease}
.crumb{font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px 24px}
.sticker{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:12px;padding:5px 12px;border-radius:99px;margin-bottom:14px;background:var(--soft);color:var(--ink)}
.sticker b{font-size:13px}
h1{font-weight:600;font-size:clamp(20px,4.4vw,25px);letter-spacing:-0.5px;line-height:1.28;margin-bottom:6px}
h2{font-weight:600;font-size:16px;margin:20px 0 8px}
.hint{font-size:14px;color:var(--muted);margin-bottom:20px}
.facts{list-style:none;margin:4px 0 18px}
.facts li{position:relative;padding:9px 0 9px 24px;border-bottom:1px solid var(--soft);font-size:14.5px}
.facts li:last-child{border-bottom:none}
.facts li:before{content:"";position:absolute;left:2px;top:16px;width:7px;height:7px;border-radius:50%;background:var(--blue)}
.facts b{font-weight:600}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:18px}
@media(max-width:560px){.chips{grid-template-columns:1fr}}
.chip{display:flex;align-items:flex-start;gap:10px;font-family:inherit;font-size:14.5px;font-weight:400;color:var(--ink);text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;transition:background .12s ease,border-color .12s ease}
.chip .letter{flex:none;width:21px;height:21px;border-radius:50%;margin-top:1px;display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:11px;background:var(--soft);color:var(--muted)}
.chip:hover{background:var(--paper)}
.chip:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.chip.on{border-color:var(--ink);font-weight:600;background:var(--card)}
.chip.on .letter{background:var(--ink);color:#fff}
label.small{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;letter-spacing:.2px}
textarea,input[type=text],select{width:100%;font-family:inherit;font-size:15px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px;resize:vertical}
textarea{min-height:76px}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--ink);background:#fff}
input[type=text],select{margin-bottom:14px}
.tidybar{display:flex;gap:14px;align-items:center;margin-top:8px;flex-wrap:wrap}
.tidybtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--blue);background:transparent;border:none;padding:6px 0;cursor:pointer}
.tidybtn:hover{opacity:.7}
.tidybtn.ghost{color:var(--muted)}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:20}
.nav .in{max-width:620px;margin:0 auto;display:flex;gap:10px;padding:12px 16px}
.btn{font-family:inherit;font-weight:600;font-size:15px;border:none;border-radius:10px;padding:13px 22px;cursor:pointer;transition:opacity .12s ease}
.btn:active{opacity:.8}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--blue);color:#fff;flex:1}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.big{width:100%;padding:14px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(14px);background:var(--ink);color:#fff;font-size:14px;font-weight:500;padding:11px 20px;border-radius:8px;opacity:0;pointer-events:none;transition:all .25s ease;z-index:60}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.review{list-style:none}
.review li{padding:13px 0;border-bottom:1px solid var(--soft)}
.review li:last-child{border-bottom:none}
.review .q{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:3px}
.review .a{font-size:14.5px}
.review .a em{color:var(--muted);font-style:normal}
.codebox{width:100%;min-height:130px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.big-tick{width:58px;height:58px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:27px;margin-bottom:16px}
.err{background:var(--soft);border-radius:10px;padding:14px 16px;font-size:14px;margin-bottom:16px}
.sending{display:flex;flex-direction:column;align-items:center;text-align:center;padding:14px 0 6px}
.spinner{width:52px;height:52px;border-radius:50%;margin-bottom:22px;
  background:conic-gradient(from 0deg,#833AB4,#E1306C,#F77737,#833AB4);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 0);
  mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 0);
  animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sending .line{font-size:16px;font-weight:600;min-height:24px;animation:fadein .4s ease}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.dots{display:flex;gap:6px;margin-top:16px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line);transition:background .3s}
.dots i.on{background:var(--ink)}
</style>
</head>
<body>

<div class="shell">
  <div class="main">
    <header>
      <div class="logo">A few <span>questions</span></div>
      <div class="who" id="who"></div>
    </header>
    <div class="thread"><i id="bar"></i></div>
    <div class="crumb" id="crumb">Let's begin</div>
    <div id="screen"></div>
  </div>
</div>

<div class="nav" id="nav" style="display:none">
  <div class="in">
    <button class="btn ghost" id="backBtn" type="button">Back</button>
    <button class="btn primary" id="nextBtn" type="button">Next</button>
  </div>
</div>
<div class="toast" id="toast"></div>

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function toast(msg){
  var t = $("toast");

  t.classList.add("on");
  clearTimeout(t._h);
  t._h = setTimeout(function(){ t.classList.remove("on"); }, 1900);
}

function ans(id, isMonth){
  if(!state.answers[id]) state.answers[id] = isMonth ? {month:"", other:""} : {picked:[], other:""};
  return state.answers[id];
}

function saveDraft(){
  try{ localStorage.setItem(DRAFT_KEY, JSON.stringify({state:state, step:step})); }catch(e){}
}
function loadDraft(){
  try{
    var raw = localStorage.getItem(DRAFT_KEY);
    if(!raw) return false;
    var d = JSON.parse(raw);
    if(!d || !d.state) return false;
    state = d.state;
    if(state.sent) return false;
    step = typeof d.step === "number" ? d.step : -1;
    return true;
  }catch(e){ return false; }
}

var ALPHA = "abcdefghijklmnopqrstuvwxyz";

/* every word one edit away: drop a letter, swap two neighbours, change a letter, add a letter */
function editsOnce(w){
  var out = [], i, c;
  for(i=0;i<w.length;i++) out.push(w.slice(0,i) + w.slice(i+1));
  for(i=0;i<w.length-1;i++) out.push(w.slice(0,i) + w.charAt(i+1) + w.charAt(i) + w.slice(i+2));
  for(i=0;i<w.length;i++) for(c=0;c<26;c++) out.push(w.slice(0,i) + ALPHA.charAt(c) + w.slice(i+1));
  for(i=0;i<=w.length;i++) for(c=0;c<26;c++) out.push(w.slice(0,i) + ALPHA.charAt(c) + w.slice(i));
  return out;
}

/* returns a correction, or "" when it is not confident enough to touch it */
function correctWord(low){
  if(low.length < 4) return "";
  if(DICT[low]) return "";
  var cands = editsOnce(low), hits = {}, list = [], i;
  for(i=0;i<cands.length;i++){
    var c = cands[i];
    if(DICT[c] && !hits[c]){ hits[c] = 1; list.push(c); }
  }
  if(list.length === 1) return list[0];
  if(list.length > 1){
    list.sort(function(a,b){ return Math.abs(a.length-low.length) - Math.abs(b.length-low.length); });
    if(Math.abs(list[0].length-low.length) < Math.abs(list[1].length-low.length)) return list[0];
  }
  return "";
}

function matchCase(orig, fixed){
  if(orig === orig.toUpperCase() && orig.length > 1) return fixed.toUpperCase();
  if(orig.charAt(0) === orig.charAt(0).toUpperCase()) return fixed.charAt(0).toUpperCase() + fixed.slice(1);
  return fixed;
}

var TIDY_PROPER = {
  "monday":"Monday","tuesday":"Tuesday","wednesday":"Wednesday","thursday":"Thursday",
  "friday":"Friday","saturday":"Saturday","sunday":"Sunday",
  "january":"January","february":"February","march":"March","april":"April",
  "june":"June","july":"July","august":"August","september":"September",
  "october":"October","november":"November","december":"December",
  "australia":"Australia","australian":"Australian","aussie":"Aussie",
  "brisbane":"Brisbane","sydney":"Sydney","melbourne":"Melbourne","queensland":"Queensland",
  "abn":"ABN","crm":"CRM","gst":"GST","asic":"ASIC","kpi":"KPI","kpis":"KPIs"
};

function tidyEsc(w){ return w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

function tidyText(raw){
  if(!raw) return "";
  var t = String(raw);

  t = t.replace(/[\u2018\u2019\u02BC]/g, "'").replace(/[\u201C\u201D]/g, '"');
  t = t.replace(/\r\n?/g, "\n");
  t = t.split("\n").map(function(l){ return l.replace(/[ \t]+/g, " ").trim(); }).join("\n");
  t = t.replace(/\n{3,}/g, "\n\n").trim();
  if(!t) return "";

  t = t.replace(/\.{4,}/g, "...").replace(/([!?]){2,}/g, "$1").replace(/,{2,}/g, ",");
  t = t.replace(/\s+([,.!?;:])/g, "$1");
  t = t.replace(/([,;:])(?=[^\s\d])/g, "$1 ");
  t = t.replace(/([.!?])(?=[A-Za-z])/g, "$1 ");
  t = t.replace(/\(\s+/g, "(").replace(/\s+\)/g, ")");

  for(var w in TIDY_WORDS){
    if(!TIDY_WORDS.hasOwnProperty(w)) continue;
    t = t.replace(new RegExp("\\b" + tidyEsc(w) + "\\b", "gi"), TIDY_WORDS[w]);
  }

  t = t.replace(/[A-Za-z]+/g, function(word){
    var low = word.toLowerCase();
    var fix = correctWord(low);
    return fix ? matchCase(word, fix) : word;
  });

  for(var pn in TIDY_PROPER){
    if(!TIDY_PROPER.hasOwnProperty(pn)) continue;
    t = t.replace(new RegExp("\\b" + tidyEsc(pn) + "\\b", "gi"), TIDY_PROPER[pn]);
  }

  t = t.replace(/\bi\b/g, "I");
  t = t.replace(/\bi'/g, "I'");
  t = t.replace(/\ba ([aeiouAEIOU])/g, "an $1");
  t = t.replace(/\ban ([^aeiouAEIOU\s])/g, "a $1");
  t = t.replace(/\b(\w+) \1\b/gi, function(m, one){
    return (/^(had|that|is|very|no)$/i).test(one) ? m : one;
  });
  t = t.replace(/(^|[.!?]\s+|\n\s*)([a-z])/g, function(m, lead, ch){ return lead + ch.toUpperCase(); });
  if(!/[.!?:]$/.test(t)) t += ".";

  return t;
}

function attachTidy(id, setter){
  var ta = $(id);
  if(!ta) return;
  var bar = document.createElement("div");
  bar.className = "tidybar";
  var btn = document.createElement("button");
  btn.type = "button"; btn.className = "tidybtn"; btn.textContent = "Check my spelling";
  var undo = document.createElement("button");
  undo.type = "button"; undo.className = "tidybtn ghost"; undo.textContent = "Undo"; undo.style.display = "none";
  var prev = "";
  btn.addEventListener("click", function(){
    var before = ta.value;
    if(!before.trim()){ toast("Nothing to check yet"); return; }
    var after = tidyText(before);
    if(after === before){ toast("Looks good already"); return; }
    prev = before; ta.value = after; setter(after);
    undo.style.display = ""; toast("Cleaned up");
  });
  undo.addEventListener("click", function(){
    if(!prev) return;
    ta.value = prev; setter(prev); undo.style.display = "none"; toast("Put back");
  });
  bar.appendChild(btn); bar.appendChild(undo);
  ta.parentNode.insertBefore(bar, ta.nextSibling);
}

/* ---------------- screens ---------------- */

function renderIntro(){
  $("screen").innerHTML =
    '<div class="card">' +
      '<div class="sticker">Around ten minutes</div>' +
      '<h1>Before we have a chat, tell us a bit about you</h1>' +
      '<p class="hint">Only twenty questions, and there are no right or wrong answers. Take a breath and answer honestly, there is no judgement here.</p>' +
      '<label class="small" for="nameIn">Your full name</label>' +
      '<input type="text" id="nameIn" autocomplete="name" placeholder="First and last">' +
    '</div>';
  $("nameIn").value = state.name;
  $("nameIn").addEventListener("input", function(){ state.name = this.value; saveDraft(); refreshChrome(); });
}

function renderMonth(qi){
  var q = QUESTIONS[qi], sec = SECTIONS[q.sec], a = ans(q.id, true);
  var opts = '<option value="">Pick a month</option>';
  for(var m=0;m<12;m++) opts += '<option value="' + MONTHS[m] + '">' + MONTHS[m] + '</option>';
  $("screen").innerHTML =
    '<div class="card">' +
      '<div class="sticker"><b>' + (qi+1) + '</b> &middot; ' + esc(sec.name) + '</div>' +
      '<h1>' + esc(q.q) + '</h1>' +
      '<p class="hint">The month is enough, we do not need the date.</p>' +
      '<select id="monthIn">' + opts + '</select>' +
      '<label class="small" for="otherIn">Anything you would like to add</label>' +
      '<textarea id="otherIn" placeholder="Optional"></textarea>' +
    '</div>';
  $("monthIn").value = a.month || "";
  $("monthIn").addEventListener("change", function(){ a.month = this.value; saveDraft(); });
  var other = $("otherIn");
  other.value = a.other || "";
  other.addEventListener("input", function(){ a.other = this.value; saveDraft(); });
  attachTidy("otherIn", function(v){ a.other = v; saveDraft(); });
}

function renderQuestion(qi){
  var q = QUESTIONS[qi];
  if(q.type === "month"){ renderMonth(qi); return; }
  var sec = SECTIONS[q.sec], a = ans(q.id, false);
  var chipsHtml = "";
  for(var i=0;i<q.opts.length;i++){
    var on = a.picked.indexOf(q.opts[i]) !== -1;
    chipsHtml += '<button type="button" class="chip' + (on ? " on" : "") + '" data-opt="' + esc(q.opts[i]) + '">' +
      '<span class="letter">' + String.fromCharCode(65 + i) + '</span><span>' + esc(q.opts[i]) + '</span></button>';
  }
  $("screen").innerHTML =
    '<div class="card">' +
      '<div class="sticker"><b>' + (qi+1) + '</b> &middot; ' + esc(sec.name) + '</div>' +
      '<h1>' + esc(q.q) + '</h1>' +
      '<p class="hint">Select whichever apply. More than one is fine, and there is space below if you would rather answer in your own words.</p>' +
      '<div class="chips">' + chipsHtml + '</div>' +
      '<label class="small" for="otherIn">In your own words</label>' +
      '<textarea id="otherIn" placeholder="Optional, though we do read every one"></textarea>' +
    '</div>';
  var chips = $("screen").querySelectorAll(".chip");
  for(var c=0;c<chips.length;c++){
    chips[c].addEventListener("click", function(){
      var opt = this.getAttribute("data-opt");
      var idx = a.picked.indexOf(opt);
      if(idx === -1){ a.picked.push(opt); this.classList.add("on"); }
      else { a.picked.splice(idx,1); this.classList.remove("on"); }
      saveDraft();
    });
  }
  var other = $("otherIn");
  other.value = a.other || "";
  other.addEventListener("input", function(){ a.other = this.value; saveDraft(); });
  attachTidy("otherIn", function(v){ a.other = v; saveDraft(); });
}

function renderReview(){
  var html = '<div class="card">' +
    '<div class="sticker">Nearly done</div>' +
    '<h1>Have a read through before you send</h1>' +
    '<p class="hint">Select Back if you would like to change anything.</p><ul class="review">';
  html += '<li><div class="q">Name</div><div class="a">' + (esc(state.name) || '<em>Not filled in</em>') + '</div></li>';
  for(var i=0;i<QUESTIONS.length;i++){
    var q = QUESTIONS[i], a = state.answers[q.id];
    var val = "";
    if(a){
      if(q.type === "month") val = esc(a.month || "");
      else if(a.picked && a.picked.length) val = esc(a.picked.join(" \u00b7 "));
      if(a.other && a.other.trim()) val += (val ? "<br>" : "") + esc(a.other);
    }
    html += '<li><div class="q">' + (i+1) + '. ' + esc(q.short) + '</div><div class="a">' + (val || '<em>Skipped</em>') + '</div></li>';
  }
  html += '</ul></div>';
  $("screen").innerHTML = html;
}

var SENDING_LINES = [
  "Sending your answers",
  "Politely asking the internet to hurry up",
  "Reading your handwriting",
  "Checking you really said that",
  "Filing you under worth a call",
  "Almost there, thanks for waiting"
];

function renderSending(){
  var host = $("screen");
  var dots = "";
  for(var i=0;i<SENDING_LINES.length;i++) dots += '<i' + (i===0?' class="on"':'') + '></i>';
  host.innerHTML =
    '<div class="card">' +
      '<div class="sending">' +
        '<div class="spinner"></div>' +
        '<div class="line" id="sendLine">' + SENDING_LINES[0] + '</div>' +
        '<div class="dots" id="sendDots">' + dots + '</div>' +
      '</div>' +
    '</div>';
  var n = 0;
  return setInterval(function(){
    n = (n + 1) % SENDING_LINES.length;
    var line = $("sendLine");
    if(!line) return;
    line.style.animation = "none";
    line.offsetHeight;
    line.style.animation = "";
    line.textContent = SENDING_LINES[n];
    var ds = $("sendDots").children;
    for(var i=0;i<ds.length;i++) ds[i].className = (i === n ? "on" : "");
  }, 1400);
}

function renderDone(ok, payload){
  var host = $("screen");
  if(ok){
    host.innerHTML =
      '<div class="card">' +
        '<div class="big-tick">&#10003;</div>' +
        '<h1>All sent, thanks ' + (esc(state.name.split(" ")[0]) || "for that") + '</h1>' +
        '<p class="hint">Your answers have come through. We will be in touch shortly to arrange a time to talk. You can close this page now.</p>' +
      '</div>';
  } else {
    host.innerHTML =
      '<div class="card">' +
        '<div class="sticker">Almost</div>' +
        '<h1>Could not send automatically</h1>' +
        '<div class="err">Nothing has been lost. Select the copy button below, then paste your answers into an email or text back to whoever sent you this link.</div>' +
        '<textarea class="codebox" id="codeBox" readonly></textarea>' +
        '<button class="btn primary big" id="copyBtn" type="button">Copy my answers</button>' +
      '</div>';
    $("codeBox").value = JSON.stringify(payload);
    $("copyBtn").addEventListener("click", function(){
      var box = $("codeBox");
      box.select(); box.setSelectionRange(0, 999999);
      var done = false;
      try{ done = document.execCommand("copy"); }catch(e){}
      if(navigator.clipboard && !done){
        navigator.clipboard.writeText(box.value).then(function(){ toast("Copied"); });
      } else {
        toast(done ? "Copied" : "Select it all and copy");
      }
    });
  }
}

/* ---------------- chrome ---------------- */

function refreshChrome(){
  var pct = 0, crumb = "Let's begin", nextLabel = "Start", canNext = true;
  if(step === -1){
    canNext = !!state.name.trim();
    nextLabel = "Start";
  } else if(step >= 0 && step < TOTAL){
    pct = ((step + 1) / (TOTAL + 1)) * 100;
    crumb = SECTIONS[QUESTIONS[step].sec].name + " \u00b7 " + (step + 1) + " of " + TOTAL;
    nextLabel = step === TOTAL - 1 ? "Review" : "Next";
  } else if(step === TOTAL){
    pct = 100; crumb = "Check it over"; nextLabel = "Send my answers";
  } else {
    pct = 100; crumb = "Done";
  }
  $("bar").style.width = pct + "%";
  $("crumb").textContent = crumb;
  $("who").textContent = step > -1 && state.name ? state.name : "";
  var nav = $("nav");
  if(step >= TOTAL + 1){ nav.style.display = "none"; return; }
  nav.style.display = "";
  $("backBtn").style.display = step <= -1 ? "none" : "";
  $("nextBtn").textContent = nextLabel;
  $("nextBtn").disabled = !canNext;
}

function render(){
  window.scrollTo(0,0);
  if(step === -1) renderIntro();
  else if(step >= 0 && step < TOTAL) renderQuestion(step);
  else if(step === TOTAL) renderReview();
  refreshChrome();
  saveDraft();
}

function buildPayload(){
  var flat = { name:state.name, submitted:new Date().toISOString() };
  for(var i=0;i<QUESTIONS.length;i++){
    var q = QUESTIONS[i], a = state.answers[q.id] || {};
    var picked = q.type === "month" ? (a.month || "") : ((a.picked || []).join(", "));
    var own = (a.other || "").trim();
    var val = picked;
    if(own) val += (val ? "\n\n" : "") + own;
    flat[q.id] = val;
  }
  return flat;
}

function send(){
  var payload = buildPayload();
  var started = Date.now();
  step = TOTAL + 1;
  $("nav").style.display = "none";
  var timer = renderSending();
  refreshChrome();
  $("nav").style.display = "none";

  function finish(ok){
    // let the spinner have its moment, it feels broken if it flashes past
    var wait = Math.max(0, 2600 - (Date.now() - started));
    setTimeout(function(){
      clearInterval(timer);
      state.sent = true; saveDraft();
      if(ok){ try{ localStorage.removeItem(DRAFT_KEY); }catch(e){} }
      renderDone(ok, payload);
      refreshChrome();
    }, wait);
  }

  if(!ENDPOINT){ finish(false); return; }

  fetch(ENDPOINT, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  }).then(function(){ finish(true); }).catch(function(){ finish(false); });
}

$("nextBtn").addEventListener("click", function(){
  if(step === TOTAL){ send(); return; }
  if(step === -1 && !state.name.trim()){ toast("Your name first"); return; }
  step++;
  render();
});
$("backBtn").addEventListener("click", function(){
  if(step <= -1) return;
  step--;
  render();
});

document.addEventListener("keydown", function(e){
  var tag = (e.target.tagName || "").toLowerCase();
  if(tag === "input" || tag === "textarea" || tag === "select") return;
  if(e.key === "ArrowRight" || e.key === "Enter"){ $("nextBtn").click(); }
  if(e.key === "ArrowLeft"){ $("backBtn").click(); }
});

if(loadDraft() && step > -1){
  render();
  toast("Picked up where you left off");
} else {
  step = -1;
  render();
}
</script>
</body>
</html>
